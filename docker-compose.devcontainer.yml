# ============================================================================
# Conflux DevKit - DevContainer Service Management
# Optimized for development with hot reloading and debugging
# ============================================================================

version: '3.8'

services:
  # Backend API Server
  backend-api:
    build:
      context: ./packages/devkit-backend
      dockerfile: Dockerfile
    container_name: devkit-backend-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOG_LEVEL=debug
    volumes:
      - ./packages/devkit-backend:/workspaces/conflux-devkit/packages/devkit-backend
      - ./logs:/workspaces/conflux-devkit/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    profiles:
      - backend

  # Backend WebSocket Server
  backend-ws:
    build:
      context: ./packages/devkit-backend
      dockerfile: Dockerfile
    container_name: devkit-backend-ws
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - LOG_LEVEL=debug
    volumes:
      - ./packages/devkit-backend:/workspaces/conflux-devkit/packages/devkit-backend
      - ./logs:/workspaces/conflux-devkit/logs
    healthcheck:
      test: ["CMD", "netstat", "-an", "|", "grep", ":3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    profiles:
      - backend

  # Demo Frontend
  demo-frontend:
    build:
      context: ./packages/devkit-demo
      dockerfile: Dockerfile
    container_name: devkit-demo-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3001/api
      - VITE_WS_URL=ws://localhost:3002
    volumes:
      - ./packages/devkit-demo:/workspaces/conflux-devkit/packages/devkit-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - backend-api
      - backend-ws
    profiles:
      - frontend

  # Conflux nodes are now managed internally by DevKit backend services
  # No need for separate Conflux core/EVM containers

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    profiles:
      - cache
    restart: unless-stopped

  # PostgreSQL for persistent data (optional)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: conflux_devkit
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - database
    restart: unless-stopped

  # MongoDB for document storage (optional)
  mongodb:
    image: mongo:7
    container_name: mongodb-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
      MONGO_INITDB_DATABASE: conflux_devkit
    volumes:
      - mongodb-data:/data/db
    profiles:
      - database
    restart: unless-stopped

  # Nginx reverse proxy for development
  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.devcontainer.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api-server
      - state-server
      - demo-webapp
    profiles:
      - proxy
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  mongodb-data:

networks:
  default:
    name: conflux-devkit-dev
    driver: bridge

