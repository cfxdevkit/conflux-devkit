apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-server
  namespace: conflux-devkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: state-server
  template:
    metadata:
      labels:
        app: state-server
    spec:
      containers:
      - name: state-server
        image: conflux-devkit/state-server:latest
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: state-server
  namespace: conflux-devkit
spec:
  selector:
    app: state-server
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP


